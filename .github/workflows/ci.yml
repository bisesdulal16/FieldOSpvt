name: CI

# Runs on every PR and push to main. Guards the money/security paths (pytest)
# and proves both container images still build before anything can deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fieldos-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"       # 3.11/3.12 only — 3.14 breaks pydantic
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # Tests use an isolated /tmp DB (see tests/conftest.py) — no dev data touched.
        run: pytest -q

  backend-migration-chain:
    name: Backend — PostgreSQL Alembic clean-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fieldos-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldos
          POSTGRES_PASSWORD: fieldos_test_password
          POSTGRES_DB: fieldos_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldos -d fieldos_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Empty PostgreSQL Alembic chain and schema parity validate
        env:
          RUN_ALEMBIC_POSTGRES_CHAIN: "1"
          MIGRATION_TEST_DATABASE_URL: postgresql://fieldos:fieldos_test_password@127.0.0.1:5432/fieldos_admin
        run: pytest -q tests/test_alembic_clean_install_chain.py tests/test_alembic_schema_parity.py

  dashboard-build:
    name: Dashboard — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fieldos-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fieldos-dashboard/package-lock.json

      - run: npm ci
      - run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend-tests, dashboard-build]
    steps:
      - uses: actions/checkout@v4
      # Build both images to catch Dockerfile drift before deploy. No push here.
      - name: Build backend image
        run: docker build -t fieldos-backend:ci ./fieldos-backend
      - name: Build dashboard image
        run: docker build -t fieldos-dashboard:ci ./fieldos-dashboard

  messaging-infra-validation:
    name: Messaging infra — config/imports/secrets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fieldos-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Worker module imports
        run: |
          python - <<'PY'
          import app.workers.communication_publisher
          import app.workers.communication_consumer
          import app.services.communication_broker
          import app.services.replay_store
          PY
      - name: Workflow JSON still valid
        working-directory: .
        run: python -m json.tool n8n/workflows/client-protection-daily-report.json >/dev/null && for f in n8n/workflows/*.json; do python -m json.tool "$f" >/dev/null; done
      - name: Compose config validates
        working-directory: .
        env:
          FIELDOS_RABBITMQ_PASSWORD: ci_placeholder_password
          FIELDOS_REDIS_PASSWORD: ci_placeholder_password
          DATABASE_URL: postgresql+asyncpg://fieldos:ci@postgres:5432/fieldos_nepal
        run: docker compose -f infra/client-protection/compose.yml config >/dev/null
      - name: No secrets in infra files
        working-directory: .
        run: |
          ! grep -RInE '(ghp_|xox[baprs]-|sk-[A-Za-z0-9]|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' infra/client-protection
